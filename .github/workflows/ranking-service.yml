# Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# AWS_REGION is set inline as ap-northeast-2

name: ranking-service

on:
  push:
    branches:
      - main
    paths:
      - apps/ranking-service/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: cd apps/ranking-service && go test ./...

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: scalerank-ranking-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./apps/ranking-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-northeast-2 --name scalerank-eks

      - name: Deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: scalerank-ranking-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/ranking-service \
            ranking-service=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n scalerank
          kubectl rollout status deployment/ranking-service \
            -n scalerank --timeout=300s
